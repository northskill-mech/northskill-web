<section class="relative py-16 md:py-24" id="{{ .Params.id | default "image-carousel" }}">
  <div class="container relative">
    
    <!-- Optional Title -->
    {{ if .Params.title }}
    <div class="grid grid-cols-1 pb-8 text-center">
      <h2 class="mb-4 text-2xl leading-normal font-semibold md:text-4xl md:leading-normal">{{ .Params.title | safeHTML }}</h2>
    </div>
    {{ end }}

    <!-- The Swipeable Carousel -->
    <div class="flex overflow-x-auto snap-x snap-mandatory gap-6 pb-8 pt-2" style="scrollbar-width: thin;">
      
      {{ range .Params.images }}
        <!-- Outer wrapper holding both the image and the text -->
        <div class="snap-center shrink-0 flex flex-col" style="width: 600px; min-width: 400px;">
          
          <!-- The strictly sized image box -->
          <div class="relative rounded-lg shadow-sm overflow-hidden bg-gray-100 border border-gray-200" style="height: 400px;">
            <img 
              src="{{ .src }}" 
              alt="{{ .alt }}" 
              class="object-cover hover:scale-105 duration-500 transition-transform" 
              style="width: 100%; height: 100%;"
              loading="lazy"
            >
          </div>

          <!-- The Caption -->
          {{ if .caption }}
            <p class="mt-3 text-center text-slate-600 font-medium">{{ .caption }}</p>
          {{ end }}
          
        </div>
      {{ end }}
      
    </div>
</section>
