<section class="relative md:py-24 py-16 bg-white" id="{{ .Params.id | default "map-section" }}">
  <div class="container relative">
    
    <!-- Title and Top Text Section -->
    {{ if or .Params.title .Params.text }}
    <div class="grid grid-cols-1 pb-8 md:pb-12 text-center">
      {{ if .Params.title }}
        <h2 class="mb-4 md:text-4xl md:leading-normal text-3xl leading-normal font-bold text-slate-900">{{ .Params.title }}</h2>
      {{ end }}
      {{ if .Params.text }}
        <p class="mx-auto max-w-xl text-lg text-slate-600">{{ .Params.text | markdownify }}</p>
      {{ end }}
    </div>
    {{ end }}

    <!-- 2/3 Map and 1/3 Info Section -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-[30px] items-center">
      
      <!-- Left Side: Map Container -->
      <div class="md:col-span-7 lg:col-span-8 w-full min-h-[400px] h-full rounded-xl shadow-xs border border-slate-100 overflow-hidden relative">
        <!-- This CSS forces the iframe to perfectly fill the rounded container -->
        <div class="absolute inset-0 [&>iframe]:w-full [&>iframe]:h-full [&>iframe]:border-0">
          {{ .Params.iframe | safeHTML }}
        </div>
      </div>

      <!-- Right Side: Info Card -->
      <div class="md:col-span-5 lg:col-span-4 mt-8 md:mt-0">
        <div class="p-8 rounded-xl bg-slate-50 border border-slate-100 shadow-xs h-full flex flex-col justify-center">
          
          <!-- Styled Prose -->
          <div class="prose max-w-none 
            prose-headings:text-slate-900 prose-headings:font-bold prose-headings:mt-0 prose-headings:mb-4 prose-h3:text-2xl
            prose-p:text-slate-600 prose-p:leading-relaxed 
            prose-ul:text-slate-600 prose-li:my-1
            prose-strong:text-slate-900 
            [&_a]:text-primary [&_a]:font-semibold [&_a]:underline [&_a]:transition-colors [&_a]:duration-300 [&_a:hover]:text-blue-700 [&_a:hover]:no-underline">
            {{ .Params.info_text | markdownify }}
          </div>
          
        </div>
      </div>

    </div>
    
  </div>
</section>
