<section class="relative md:py-24 py-16 overflow-hidden bg-slate-50" id="{{ .Params.id | default "services" }}">
  <div class="container relative">
    
    <!-- Header -->
    <div class="grid grid-cols-1 pb-8 items-end text-center">
      <h2 class="mb-4 md:text-4xl md:leading-normal text-3xl leading-normal font-bold text-slate-900">{{ .Params.title }}</h2>
      {{ with .Params.subtitle }}
      <p class="text-slate-600 text-lg max-w-xl mx-auto duration-500 mt-3">{{ . }}</p>
      {{ end }}
    </div>

    <!-- 3-Column Grid -->
    <div class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 mt-8 gap-[30px]">
      {{ range .Params.items }}
      <div class="group relative p-8 shadow-xs rounded-xl bg-white border border-slate-100 overflow-hidden">
        
        <!-- Theme Hexagon & Primary Icon -->
        <div class="relative overflow-hidden text-transparent -m-3">
          {{ partial "components/icon.html" (dict "name" "hexagon" "class" "size-24 fill-blue-600/5") }}
          <div class="absolute top-0 left-0 w-24 h-24 text-primary rounded-xl duration-500 text-3xl flex items-center justify-center">
            <i class="{{ .icon }} leading-none inline-flex items-center justify-center"></i>
          </div>
        </div>
        
        <!-- Text Content -->
        <div class="mt-6">
          <h3 class="text-xl font-bold text-slate-900 duration-500">{{ .title }}</h3>
          <p class="text-slate-600 leading-relaxed duration-500 mt-3 [&_a]:text-primary [&_a]:font-semibold [&_a]:underline [&_a]:transition-colors [&_a]:duration-300 [&_a:hover]:text-blue-700 [&_a:hover]:no-underline">
            {{ .description | markdownify }}
          </p>
        </div>
        
      </div>
      {{ end }}
    </div>

  </div>
</section>
